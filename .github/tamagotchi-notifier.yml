# Copy this file into each project repo as .github/workflows/notify-tamagotchi.yml
#
# GitHub only delivers the `watch` (star) event to the repository that was
# starred, so every repo that should feed the pet needs this tiny notifier.
#
# One-time setup in each repo that gets it:
#   Settings -> Secrets and variables -> Actions -> New repository secret
#     Name:  TAMAGOTCHI_TOKEN
#     Value: a token that can write to jason1015-coder/jason1015-coder
#            - fine-grained PAT: select that repo first, then give Contents
#              write access (the dropdown option is "Read and write" in the
#              current UI; the endpoint only needs the write half)
#            - classic PAT:      `public_repo` scope (the profile repo is public),
#              which is the option to use if fine-grained tokens are unavailable
#
# Nothing else is needed: the profile repo's own GITHUB_TOKEN does the commit.

name: Notify the tamagotchi

on:
  watch:
    types: [started]

permissions: {}

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Tell the profile repo a star arrived
        env:
          TAMAGOTCHI_TOKEN: ${{ secrets.TAMAGOTCHI_TOKEN }}
        run: |
          if [ -z "$TAMAGOTCHI_TOKEN" ]; then
            echo "TAMAGOTCHI_TOKEN is not set for $GITHUB_REPOSITORY; skipping."
            exit 0
          fi

          code=$(curl -sS -o /tmp/dispatch.json -w '%{http_code}' \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $TAMAGOTCHI_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/jason1015-coder/jason1015-coder/dispatches" \
            -d "{\"event_type\":\"repo-starred\",\"client_payload\":{\"repo\":\"$GITHUB_REPOSITORY\"}}")

          echo "dispatch response: $code"
          cat /tmp/dispatch.json || true
          # 204 No Content is the success case for a dispatch.
          [ "$code" = "204" ]
