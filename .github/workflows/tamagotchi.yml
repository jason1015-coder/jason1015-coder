name: Feed the tamagotchi

on:
  # A star on this repo fires the watch event and feeds it right away.
  watch:
    types: [started]
  # Repos that cannot fire `watch` here (everything except this one) send this
  # dispatch from their own star event, which makes those stars instant too.
  repository_dispatch:
    types: [repo-starred]
  # Backstop for anything the dispatch misses. Five minutes is GitHub's floor.
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: tamagotchi
  cancel-in-progress: false

jobs:
  feed:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Render the pet from the star count
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/tamagotchi.mjs

      - name: Commit the new card
        run: |
          if git diff --quiet -- tamagotchi.svg; then
            echo "Pet unchanged, nothing to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tamagotchi.svg
          git commit -m "Feed the tamagotchi"
          # A manual README push can land between checkout and here; replay on top.
          git pull --rebase --autostash origin ${GITHUB_REF_NAME}
          git push
